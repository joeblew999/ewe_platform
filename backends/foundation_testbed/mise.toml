# foundation_testbed — self-contained dev environment
# Works standalone: `cd backends/foundation_testbed && mise run doctor`

[env]
PROJECT_ROOT = "{{config_root}}"

[tools]
# QEMU is installed via `mise run sys:install-testbed` (root mise.toml),
# which uses apt/pacman on Linux and points to UTM on macOS.

# Hetzner Cloud CLI — drives remote VM provisioning for testbed deployment.
hcloud = "latest"

# Cross-compile toolchain (Rust → Linux musl from any host):
#   zig provides the C cross-compiler + linker
#   cargo-zigbuild wraps cargo to drive it
# Together: ~75 MB, no brew/apt needed, no source builds.
zig = "latest"
"cargo:cargo-zigbuild" = "latest"

[tasks.check]
description = "Check testbed prerequisites"
run = """
#!/usr/bin/env bash
if [[ "$(uname)" == "Linux" ]]; then
    which qemu-system-x86_64 || { echo "QEMU not installed"; exit 1; }
    test -e /dev/kvm || echo "Warning: /dev/kvm not available (no KVM acceleration)"
elif [[ "$(uname)" == "Darwin" ]]; then
    test -d /Applications/UTM.app || { echo "UTM not installed"; exit 1; }
fi
echo "✓ Testbed prerequisites satisfied"
"""

[tasks.doctor]
description = "Run foundation_testbed health check"
run = "cargo run --release --features cli,all-providers -- doctor"

[tasks.start]
description = "Start a VM locally (uses UTM on macOS, QEMU/KVM on Linux)"
run = """
#!/usr/bin/env bash
PROFILE="${1:-linux-build}"
cargo run --release --features cli,all-providers -- start "$PROFILE"
"""

[tasks.stop]
description = "Stop a VM locally"
run = """
#!/usr/bin/env bash
PROFILE="${1:-linux-build}"
cargo run --release --features cli,all-providers -- stop "$PROFILE"
"""

[tasks.test]
description = "Run unit tests"
run = "cargo test"

[tasks.build]
description = "Build testbed binary (release, cli + all VM providers) — native target"
run = "cargo build --release --features cli,all-providers"

[tasks."cross:build"]
description = "Cross-compile testbed for x86_64-unknown-linux-musl (uses zig as linker via cargo-zigbuild)"
run = """
#!/usr/bin/env bash
set -e
TARGET="x86_64-unknown-linux-musl"
ROOT="$(git rev-parse --show-toplevel)"

if ! rustup target list --installed | grep -q "^${TARGET}$"; then
    echo "Adding rustup target $TARGET..."
    rustup target add "$TARGET"
fi

cd "$ROOT"
cargo zigbuild --release --target "$TARGET" --features cli,all-providers -p foundation_testbed --bin testbed

BIN="$ROOT/target/$TARGET/release/testbed"
echo ""
echo "✓ Built: $BIN"
file "$BIN" 2>/dev/null || true
ls -lh "$BIN"
"""

[tasks.check-rust]
description = "Run cargo check"
run = "cargo check"

[tasks.clippy]
description = "Run clippy"
run = "cargo clippy -- -D warnings"

[tasks.setup-smb]
description = "Setup SMB for Windows VM mounting (requires sudo)"
run = """
#!/usr/bin/env bash
set -e

echo "Setting up SMB for QEMU..."
echo ""

SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
SETUP_SCRIPT="${SCRIPT_DIR}/scripts/linux/smb-setup.sh"

if [ ! -f "$SETUP_SCRIPT" ]; then
    echo "Error: smb-setup.sh not found at $SETUP_SCRIPT"
    exit 1
fi

# Run the setup script with sudo
if [ "$EUID" -eq 0 ]; then
    # Already running as root
    bash "$SETUP_SCRIPT"
else
    # Use sudo
    sudo bash "$SETUP_SCRIPT"
fi

echo ""
echo "SMB setup complete!"
"""

[tasks.test-mount]
description = "Test Windows SMB mount (starts VM, tests mount)"
run = """
#!/usr/bin/env bash
cargo test --test e2e_tauri test_smb_mount_only -- --ignored --nocapture
"""

# ============================================================================
# Hetzner HIL pipeline — three phases: host / vm / hil
# ============================================================================
#  hcloud:*   one-time utility tasks (token, SSH key, full teardown)
#  host:*     Phase 1 — Hetzner box lifecycle (idempotent, never auto-deletes)
#  vm:*       Phase 2 — VMs on the remote host (via ssh + testbed binary)
#  hil:*      Phase 3 — orchestrators that compose host:* + vm:*
#
# All task bodies live in ops/hetzner/*.nu (nushell — cross-platform,
# no WSL on Windows). Auto-detect helper in ops/hetzner/env.nu picks
# up existing hcloud context + matching SSH key by content match.
#
# Why `ops/` (not `scripts/`): the sibling `scripts/{linux,macos,windows}/`
# directories are GUEST-side scripts embedded into the testbed binary
# via `include_str!`. The Hetzner ops scripts are HOST-side — driven by
# mise on the dev's machine. Different lifecycle, different audience,
# different directory.
#
# Env overrides (all have sensible defaults):
#   HETZNER_CONTEXT        hcloud context name           (default: testbed)
#   HETZNER_SSH_KEY        local private key path        (default: ~/.ssh/id_ed25519)
#   HETZNER_SSH_KEY_NAME   Hetzner-side key name         (default: $USER-laptop)
#   HETZNER_HOST_NAME      persistent host name          (default: testbed-host)
#   HETZNER_HOST_TYPE      server type                   (default: ccx23)
#   HETZNER_HOST_LOCATION  datacenter                    (default: fsn1)
#   HETZNER_HOST_IMAGE     OS image                      (default: ubuntu-24.04)
#   HETZNER_PROBE_TYPE     probe server type             (default: ccx13)

# ─── hcloud: utility ────────────────────────────────────────────────────────

[tasks."hcloud:context"]
description = "Save Hetzner API token in hcloud's local config (idempotent, interactive)"
file = "ops/hetzner/context.nu"

[tasks."hcloud:ssh-key"]
description = "Upload local SSH public key to Hetzner Cloud (idempotent)"
file = "ops/hetzner/ssh-key.nu"

[tasks."hcloud:check"]
description = "Verify hcloud is authenticated against the active project"
file = "ops/hetzner/check.nu"

[tasks."hcloud:teardown"]
description = "Delete ALL servers + SSH keys + local context (full reset)"
confirm = "This deletes every server and SSH key in the active Hetzner project. Continue?"
file = "ops/hetzner/teardown.nu"

# ─── host: Phase 1 — Hetzner box lifecycle ──────────────────────────────────

[tasks."host:up"]
description = "Create the persistent testbed host (idempotent; safe to re-run)"
depends = ["hcloud:check", "hcloud:ssh-key"]
file = "ops/hetzner/host-up.nu"

[tasks."host:bootstrap"]
description = "Install QEMU + KVM userspace on the host (idempotent)"
file = "ops/hetzner/host-bootstrap.nu"

[tasks."host:deploy"]
description = "Copy local testbed binary to the host's /usr/local/bin"
file = "ops/hetzner/host-deploy.nu"

[tasks."host:ssh"]
description = "Open an interactive SSH session on the host"
file = "ops/hetzner/host-ssh.nu"

[tasks."host:status"]
description = "Show host state + all servers/keys in the project"
file = "ops/hetzner/host-status.nu"

[tasks."host:down"]
description = "Delete the persistent testbed host (the ONLY way to remove it)"
confirm = "Delete the testbed host? Any VMs and unsaved state on it will be lost."
file = "ops/hetzner/host-down.nu"

# ─── vm: Phase 2 — VMs on the remote host via testbed binary ────────────────

[tasks."vm:doctor"]
description = "Run `testbed doctor` on the remote host"
file = "ops/hetzner/vm-doctor.nu"

[tasks."vm:import"]
description = "Import a VM profile on the host (e.g. linux-build, windows-build)"
file = "ops/hetzner/vm-import.nu"

[tasks."vm:start"]
description = "Start a VM profile on the host"
file = "ops/hetzner/vm-start.nu"

[tasks."vm:stop"]
description = "Stop a VM profile on the host"
file = "ops/hetzner/vm-stop.nu"

# ─── hil: Phase 3 — orchestrators ───────────────────────────────────────────

[tasks."hil:probe-kvm"]
description = "Throwaway probe: spin a small CCX, check /dev/kvm, destroy (~€0.02, ~3 min)"
depends = ["hcloud:check", "hcloud:ssh-key"]
file = "ops/hetzner/hil-probe-kvm.nu"

[tasks."hil:probe"]
description = "First-time setup: save token, upload SSH key, run KVM probe (serial)"
file = "ops/hetzner/hil-probe.nu"

[tasks."hil:up"]
description = "Bring up a ready host: create + install QEMU + deploy testbed + doctor (serial)"
file = "ops/hetzner/hil-up.nu"

[tasks."hil:down"]
description = "Tear down the persistent host"
depends = ["host:down"]

# ============================================================================
# Path 4: Hetzner Dedicated (AX41) via Robot API
# ============================================================================
# Different API + creds from Hetzner Cloud (Path 3). Scaffolded; verified
# only at the `robot:check` level. Full lifecycle (rescue / install /
# deploy / cancel) requires an actual AX41 in your account to test.
#
# Required env:
#   HETZNER_ROBOT_USER       webservice user     (NOT account email)
#   HETZNER_ROBOT_PASSWORD   webservice password (NOT account password)
#   Create at: https://robot.hetzner.com → Settings → Web service settings
#
# Optional env:
#   HETZNER_ROBOT_SERVER     IP or server number (default: first listed)
#   HETZNER_ROBOT_HOSTNAME   hostname for installimage (default: testbed-ax41)
#   HETZNER_SSH_KEY          local private key  (default: ~/.ssh/id_ed25519)

[tasks."robot:check"]
description = "Verify Robot API creds by listing servers"
file = "ops/hetzner/robot/check.nu"

[tasks."robot:status"]
description = "List AX41 servers, status, cancellation, paid-until"
file = "ops/hetzner/robot/status.nu"

[tasks."robot:rescue"]
description = "Activate Linux rescue mode + hardware reset (boots into rescue Linux in ~2 min)"
file = "ops/hetzner/robot/rescue.nu"

[tasks."robot:install"]
description = "Run installimage over rescue SSH (assumes rescue is active)"
file = "ops/hetzner/robot/install.nu"

[tasks."robot:deploy"]
description = "Copy local testbed binary to the AX41's /usr/local/bin"
file = "ops/hetzner/robot/deploy.nu"

[tasks."robot:ssh"]
description = "Open an interactive SSH session on the AX41"
file = "ops/hetzner/robot/ssh.nu"

[tasks."robot:cancel"]
description = "Schedule cancellation at end of current billing cycle (reversible until cycle ends)"
confirm = "Schedule cancellation of the AX41 at end of current billing cycle?"
file = "ops/hetzner/robot/cancel.nu"
